name: immersion-buddy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: immersion
      POSTGRES_PASSWORD: immersion
      POSTGRES_DB: immersion
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immersion -d immersion"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://immersion:immersion@db:5432/immersion
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Bind mounts on Windows and macOS don't deliver file events; poll for --reload.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_WATCH_POLL_MS: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  web-node-modules:
  web-next:
